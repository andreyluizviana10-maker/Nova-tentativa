    <title>Atlas Biblijny 3D | Zobacz świat Biblii na mapach</title>
    <script>
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          if (nativeFetch) {
            var activeFetch = nativeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
